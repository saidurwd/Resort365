# Resort365 (Step 7.5): the central domain and every tenant subdomain, one wildcard certificate (docs/OPERATIONS.md §Provision).
# Replace resort365.app with your domain. Reverb's WebSocket is proxied on /app and /apps.

server {
    listen 80;
    listen [::]:80;
    server_name resort365.app *.resort365.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name resort365.app *.resort365.app;

    ssl_certificate     /etc/letsencrypt/live/resort365.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resort365.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/resort365/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(app|apps)/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8080;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
