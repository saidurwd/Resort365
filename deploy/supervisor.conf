; Resort365 long-running processes (Step 7.5). Copy to /etc/supervisor/conf.d/resort365.conf, then
; `sudo supervisorctl reread && sudo supervisorctl update`. Deploys restart them by terminating them (deploy.php).

[program:resort365-horizon]
process_name=%(program_name)s
command=php /var/www/resort365/current/artisan horizon
user=deploy
autostart=true
autorestart=true
stopwaitsecs=1900
redirect_stderr=true
stdout_logfile=/var/www/resort365/shared/storage/logs/horizon.log

[program:resort365-reverb]
process_name=%(program_name)s
command=php /var/www/resort365/current/artisan reverb:start --host=127.0.0.1 --port=8080
user=deploy
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/resort365/shared/storage/logs/reverb.log

[program:resort365-pulse]
process_name=%(program_name)s
command=php /var/www/resort365/current/artisan pulse:work
user=deploy
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/resort365/shared/storage/logs/pulse.log
